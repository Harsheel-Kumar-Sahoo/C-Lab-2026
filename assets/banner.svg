<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12376b"/>
      <stop offset="1" stop-color="#071a36"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b9cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b9cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M20 0V100M40 0V100M60 0V100M80 0V100M0 20H100M0 40H100M0 60H100M0 80H100" stroke="#9cc8ff" stroke-opacity="0.07" stroke-width="1"/>
      <path d="M0 0H100M0 0V100" stroke="#9cc8ff" stroke-opacity="0.18" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- corner marks -->
  <g stroke="#9cc8ff" stroke-opacity="0.6" stroke-width="2" fill="none">
    <path d="M40 90V40H90M1510 40H1560V90M40 810V860H90M1510 860H1560V810"/>
  </g>

  <!-- title block -->
  <g font-family="'DejaVu Sans Mono', Consolas, Menlo, monospace">
    <text x="100" y="205" font-size="26" fill="#9cc8ff" fill-opacity="0.8">Introduction to Programming</text>
    <text x="100" y="365" font-size="118" font-weight="700" fill="#eaf3ff" letter-spacing="-3">C-Lab-2026</text>
    <rect x="100" y="395" width="120" height="6" fill="#ffb454"/>
  </g>
  <g font-family="'DejaVu Sans', Verdana, Arial, sans-serif">
    <text x="100" y="480" font-size="38" fill="#eaf3ff">Lab assignments in C,</text>
    <text x="100" y="530" font-size="38" fill="#eaf3ff">each with its output screenshot.</text>
  </g>

  <!-- lab tags -->
  <g font-family="'DejaVu Sans Mono', Consolas, Menlo, monospace" font-size="24">
    <g>
      <rect x="100" y="600" width="300" height="60" rx="6" fill="#071a36" fill-opacity="0.55" stroke="#5cd1ff" stroke-opacity="0.7" stroke-width="2"/>
      <text x="124" y="639" fill="#ffb454">Lab01</text><text x="214" y="639" fill="#eaf3ff">C Basics</text>
    </g>
    <g>
      <rect x="420" y="600" width="300" height="60" rx="6" fill="#071a36" fill-opacity="0.55" stroke="#5cd1ff" stroke-opacity="0.7" stroke-width="2"/>
      <text x="444" y="639" fill="#ffb454">Lab02</text><text x="534" y="639" fill="#eaf3ff">Loops</text>
    </g>
    <g>
      <rect x="100" y="680" width="300" height="60" rx="6" fill="#071a36" fill-opacity="0.55" stroke="#5cd1ff" stroke-opacity="0.7" stroke-width="2"/>
      <text x="124" y="719" fill="#ffb454">Lab03</text><text x="214" y="719" fill="#eaf3ff">Arrays</text>
    </g>
    <g>
      <rect x="420" y="680" width="300" height="60" rx="6" fill="#071a36" fill-opacity="0.55" stroke="#5cd1ff" stroke-opacity="0.7" stroke-width="2"/>
      <text x="444" y="719" fill="#ffb454">Lab04</text><text x="534" y="719" fill="#eaf3ff">Strings</text>
    </g>
    <text x="100" y="810" font-size="22" fill="#9cc8ff" fill-opacity="0.8">Written in C, compiled with GCC</text>
  </g>

  <!-- code window -->
  <g font-family="'DejaVu Sans Mono', Consolas, Menlo, monospace">
    <rect x="880" y="150" width="640" height="600" rx="14" fill="#0a1426" stroke="#5cd1ff" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M880 164a14 14 0 0 1 14-14H1506a14 14 0 0 1 14 14V206H880Z" fill="#12233f"/>
    <circle cx="916" cy="178" r="8" fill="#ff6b6b"/>
    <circle cx="944" cy="178" r="8" fill="#ffb454"/>
    <circle cx="972" cy="178" r="8" fill="#6bd68f"/>
    <text x="1200" y="187" font-size="22" fill="#9cc8ff" text-anchor="middle">Q1.c</text>

    <!-- line numbers -->
    <g font-size="22" fill="#4a6a94" text-anchor="end">
      <text x="934" y="254">1</text><text x="934" y="294">2</text><text x="934" y="334">3</text>
      <text x="934" y="374">4</text><text x="934" y="414">5</text><text x="934" y="454">6</text>
      <text x="934" y="494">7</text>
    </g>

    <!-- code -->
    <g font-size="26" fill="#eaf3ff">
      <text x="962" y="254"><tspan fill="#c792ea">#include</tspan> <tspan fill="#ffb454">&lt;stdio.h&gt;</tspan></text>
      <text x="962" y="334"><tspan fill="#5cd1ff">int</tspan> <tspan fill="#82aaff">main</tspan>(<tspan fill="#5cd1ff">void</tspan>) {</text>
      <text x="1002" y="374"><tspan fill="#c792ea">for</tspan> (<tspan fill="#5cd1ff">int</tspan> i = <tspan fill="#f78c6c">1</tspan>; i &lt;= <tspan fill="#f78c6c">3</tspan>; i++)</text>
      <text x="1042" y="414"><tspan fill="#82aaff">printf</tspan>(<tspan fill="#ffb454">"Lab %d\n"</tspan>, i);</text>
      <text x="1002" y="454"><tspan fill="#c792ea">return</tspan> <tspan fill="#f78c6c">0</tspan>;</text>
      <text x="962" y="494">}</text>
    </g>

    <!-- terminal output -->
    <rect x="904" y="530" width="592" height="196" rx="8" fill="#050c19" stroke="#5cd1ff" stroke-opacity="0.25"/>
    <g font-size="23">
      <text x="928" y="572" fill="#6bd68f">$ <tspan fill="#eaf3ff">gcc Q1.c -o Q1 &amp;&amp; ./Q1</tspan></text>
      <text x="928" y="616" fill="#eaf3ff">Lab 1</text>
      <text x="928" y="652" fill="#eaf3ff">Lab 2</text>
      <text x="928" y="688" fill="#eaf3ff">Lab 3</text>
      <rect x="1004" y="672" width="12" height="22" fill="#ffb454"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
